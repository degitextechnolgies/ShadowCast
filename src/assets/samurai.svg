<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="rimGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF606A" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#FF1025" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#65000F" stop-opacity="0"/>
    </radialGradient>
    <filter id="eyesGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rim lighting glow behind character -->
  <ellipse cx="600" cy="700" rx="380" ry="520" fill="url(#rimGlow)" opacity="0.35"/>

  <!-- Hair / flowing silhouette back -->
  <path d="M760 340 Q830 320 880 420 Q900 520 860 640 Q820 760 740 780 Q620 800 540 700 Q480 580 500 460 Q520 360 580 320 Q660 300 720 340 Z" fill="#020204"/>

  <!-- Head hood silhouette -->
  <path d="M420 460 Q480 380 600 360 Q720 340 780 420 Q800 520 760 620 Q700 680 600 660 Q500 640 420 460 Z" fill="#020204"/>

  <!-- Face shadow mask -->
  <ellipse cx="600" cy="520" rx="95" ry="120" fill="#020204"/>

  <!-- Glowing red eyes -->
  <g filter="url(#eyesGlow)">
    <circle cx="545" cy="505" r="14" fill="#FF1025"/>
    <circle cx="655" cy="505" r="14" fill="#FF1025"/>
    <circle cx="545" cy="505" r="6" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="655" cy="505" r="6" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Body / flowing outfit -->
  <path d="M520 640 Q460 660 400 780 Q360 900 380 1040 Q400 1200 460 1340 Q520 1480 600 1520 Q680 1480 740 1340 Q800 1200 820 1040 Q840 900 800 780 Q740 660 680 640 Q600 640 520 640 Z" fill="#050507"/>

  <!-- Outfit folds / depth -->
  <path d="M560 800 Q600 860 640 920 Q660 980 620 1060 Q580 1120 520 1060 Q480 1000 500 920 Q520 840 560 800 Z" fill="#020204" opacity="0.5"/>
  <path d="M660 800 Q620 860 580 920 Q560 980 600 1060 Q640 1120 700 1060 Q740 1000 720 920 Q700 840 660 800 Z" fill="#020204" opacity="0.5"/>

  <!-- Sleeves flowing -->
  <path d="M400 780 Q300 820 260 920 Q240 1020 280 1100 Q320 1180 380 1120 Q420 1060 440 980 Q450 900 420 840 Q400 790 400 780 Z" fill="#050507"/>
  <path d="M800 780 Q900 820 940 920 Q960 1020 920 1100 Q880 1180 820 1120 Q780 1060 760 980 Q750 900 780 840 Q800 790 800 780 Z" fill="#050507"/>

  <!-- Left sword (back) -->
  <g transform="translate(340 680) rotate(-25)">
    <path d="M0 0 Q20 -40 40 -80 Q60 -120 80 -200 Q100 -260 120 -320 Q140 -380 160 -420" fill="none" stroke="#333" stroke-width="22" stroke-linecap="round"/>
    <path d="M150 -400 Q170 -380 170 -340 Q150 -320 150 -400" fill="#FF1025"/>
    <rect x="140" y="-260" width="30" height="24" fill="#020204" opacity="0.9"/>
  </g>

  <!-- Right sword (back) -->
  <g transform="translate(860 680) rotate(25)">
    <path d="M0 0 Q-20 -40 -40 -80 Q-60 -120 -80 -200 Q-100 -260 -120 -320 Q-140 -380 -160 -420" fill="none" stroke="#333" stroke-width="22" stroke-linecap="round"/>
    <path d="M-150 -400 Q-170 -380 -170 -340 Q-150 -320 -150 -400" fill="#FF1025"/>
    <rect x="-140" y="-260" width="30" height="24" fill="#020204" opacity="0.9"/>
  </g>

  <!-- Red rim reflections along edges -->
  <path d="M420 460 Q480 380 600 360 Q720 340 780 420 Q800 520 760 620 Q700 680 600 660 Q500 640 420 460 Z" fill="none" stroke="url(#rimGlow)" stroke-width="6" opacity="0.6"/>
  <path d="M520 640 Q460 660 400 780 Q360 900 380 1040 Q400 1200 460 1340 Q520 1480 600 1520 Q680 1480 740 1340 Q800 1200 820 1040 Q840 900 800 780 Q740 660 680 640 Q600 640 520 640 Z" fill="none" stroke="url(#rimGlow)" stroke-width="5" opacity="0.5"/>
</svg>
